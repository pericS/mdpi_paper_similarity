name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Integration tests start their own PostgreSQL with the runner's Docker.
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - name: Use a password that is not valid inside a URL
        run: echo "POSTGRES_PASSWORD='p@ss%41:/?#x'" >> .env
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
      - name: Submit a paper and search
        run: |
          id=$(curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/papers \
            -H "Content-Type: application/json" -d '{"text": "Neural retrieval"}' | jq -er .id)
          curl --fail --silent --show-error "http://127.0.0.1:8000/api/v1/posts/$id/similar"
      - if: failure()
        run: docker compose logs
