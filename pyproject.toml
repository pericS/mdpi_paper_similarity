[project]
name = "paper-similarity"
version = "0.1.0"
description = "Finds indexed arXiv papers similar to a submitted manuscript."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx2>=2.16.2",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "tokenizers>=0.23.3",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
paper-similarity = "paper_similarity.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_similarity"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused or undefined names
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # modern Python syntax
    "SIM", # simplifications
    "ANN", # missing type annotations
    "S",   # security checks
    "T20", # print() left in code
    "RUF", # Ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest tests use assert

[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: needs Docker; runs against a real PostgreSQL",
    "model: uses the real embedding model; runs only with --run-model",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
    "types-defusedxml>=0.7.0.20260504",
]
